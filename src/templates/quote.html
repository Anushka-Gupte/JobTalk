<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote $quote_no</title>
<style>
  /* Noto Sans supports ₹ on all platforms; fall back to system-ui which also covers it on modern OSes */
  @import url('data:text/css,');
  body{font:15px "Noto Sans",system-ui,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#222}
  h1{margin:0}
  table{width:100%;border-collapse:collapse;margin:24px 0}
  th,td{padding:10px 6px;border-bottom:1px solid #ddd;text-align:left}
  .n{text-align:right}
  small{display:block;color:#888;text-transform:capitalize}
  .warn{color:#b45309;background:#fef3c7;padding:2px 6px;border-radius:4px}
  .totals{text-align:right}
  .totals b{font-size:1.3em}
  .action-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    padding: 12px 16px;
    background: #f1f5f9;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
  }
  .action-btn {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-decoration: none;
  }
  .btn-print { background: #2563eb; }
  .btn-print:hover { background: #1d4ed8; }
  .btn-wa { background: #16a34a; }
  .btn-wa:hover { background: #15803d; }
  .btn-copy { background: #475569; }
  .btn-copy:hover { background: #334155; }
  @media print{
    body{margin:0;padding:0}
    .no-print{display:none !important}
  }
</style>
<div class="action-bar no-print">
  <button type="button" class="action-btn btn-print" onclick="window.print()">
    🖨️ Print / Save as PDF
  </button>
  <button type="button" class="action-btn btn-wa" onclick="shareWhatsApp()">
    💬 Share on WhatsApp
  </button>
  <button type="button" class="action-btn btn-copy" onclick="copyQuote()">
    📋 Copy Quote Text
  </button>
</div>
$business_header
$gstin_line
<p>Quote #$quote_no &middot; $date</p>
<p><b>For:</b> $customer<br>$address</p>
<p><b>Job:</b> $summary</p>
<table>
  <tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>
  $rows
</table>
$warning
<div class="totals">
  Subtotal $subtotal<br>$gst_rows$round_off_line<b>Total $total</b>
</div>
<p>$notes</p>
<p class="disclaimer" style="margin-top:30px;font-size:0.85em;color:#666;border-top:1px solid #eee;padding-top:10px;">Note: This document is an estimate / quote, not a GST tax invoice.</p>
<script type="text/javascript">
function buildSummaryText() {
  const biz = document.querySelector('h1')?.innerText || '';
  let txt = biz ? '*' + biz + '*\n' : '';
  txt += 'Quote #$quote_no · $date\n';
  if ('$customer'.trim()) txt += 'For: $customer\n';
  if ('$address'.trim()) txt += 'Address: $address\n';
  if ('$summary'.trim()) txt += 'Job: $summary\n';
  txt += '\nItems:\n';

  const rows = document.querySelectorAll('table tr');
  rows.forEach((tr, idx) => {
    if (idx === 0) return;
    const cells = tr.querySelectorAll('td');
    if (cells.length >= 4) {
      const desc = cells[0].childNodes[0]?.textContent?.trim() || cells[0].innerText.trim();
      const amt = cells[3]?.innerText?.trim() || '';
      txt += '• ' + desc + ': ' + amt + '\n';
    }
  });

  txt += '\nSubtotal: $subtotal\n$raw_gst_text*Total: $total*\n';
  return txt;
}

function shareWhatsApp() {
  const text = buildSummaryText();
  window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
}

function copyQuote() {
  const text = buildSummaryText();
  navigator.clipboard.writeText(text).then(() => {
    alert('Quote text copied to clipboard!');
  });
}
</script>
