[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtalk"
version = "0.1.0"
description = "Dictate a job, get a quote. Offline voice-to-quote for tradespeople, powered by open models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
web = ["fastapi>=0.100", "uvicorn>=0.20", "pyyaml>=6.0", "httpx>=0.24","python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5", "httpx>=0.24"]

[project.scripts]
jobtalk = "jobtalk.cli:main"

[tool.setuptools]
packages = ["jobtalk"]
package-dir = { "jobtalk" = "src" }

[tool.setuptools.package-data]
jobtalk = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 30
timeout_method = "thread"

[tool.ruff]
line-length = 100
